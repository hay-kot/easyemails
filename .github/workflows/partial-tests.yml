name: Go Build/Test

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs Go and golangci-lint from mise.lock, so CI lints with the
      # same versions as a local run.
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two supported Go releases. go.mod requires the older one.
        go-version: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          # The module has no go.sum, which is the default cache key.
          cache-dependency-path: go.mod

      - name: Test
        run: go test -race ./...
