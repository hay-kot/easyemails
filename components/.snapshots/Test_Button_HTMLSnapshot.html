<tr>
  <td align="left" style="font-size: 0px; padding: 10px 25px; word-break: break-word;">
    <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="border-collapse: separate; width: 40%; line-height: 100%;">
      <tbody>
        <tr>
          <td align="center" bgcolor="{{ .PrimaryColor }}" role="presentation" valign="middle" style="border: none; border-radius: 3px; cursor: auto; mso-padding-alt: 10px 24px; background: {{ .PrimaryColor }};">
            <a href="https://example.com" style="display: inline-block; background: {{ .PrimaryColor }}; color: {{ .PrimaryTextColor }}; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; line-height: 1.5; word-break: normal; margin: 0; text-decoration: none; text-transform: none; padding: 10px 24px; mso-padding-alt: 0px; border-radius: 3px;">Click me!</a>
          </td>
        </tr>
      </tbody>
    </table>
  </td>
</tr>
